name: Windows installer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # electron-builder 26.18.1 sets onTagOrDraft when it sees CI and no policy
      # (app-builder-lib PublishManager). never keeps the job on an Actions artifact.
      # CSC_IDENTITY_AUTO_DISCOVERY=false skips looking for a signing certificate.
      - name: Build the unsigned Windows x64 installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist -- --publish never
      - name: Confirm one unsigned installer exe
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path dist -File | Where-Object { $_.Extension -eq '.exe' })
          if ($files.Count -ne 1) {
            throw "Expected one installer exe in dist, found $($files.Count)."
          }
          $file = $files[0]
          node scripts/windows-notices.cjs $file.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installer license verification failed." }
          $signature = Get-AuthenticodeSignature -FilePath $file.FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned installer. Authenticode status: $($signature.Status)."
          }
          $sizeMb = [Math]::Round($file.Length / 1MB, 1)
          $lines = @(
            "Installer: $($file.Name)",
            "Size: $($file.Length) bytes ($sizeMb MiB)",
            "Authenticode: NotSigned"
          )
          $lines | ForEach-Object {
            Write-Output $_
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.exe
          if-no-files-found: error
          archive: false
