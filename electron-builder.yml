# Windows installer for faibots. `npm run dist` builds the app, then writes
# dist/faibots-Setup-<version>.exe. Docs: https://www.electron.build/configuration

# Must match app.setAppUserModelId() in src/main/index.ts: Windows ties toasts and the taskbar
# entry to this id, so changing it breaks notifications for installed copies.
appId: com.faibots.app
productName: faibots
copyright: Copyright © 2026 fai.qa

directories:
  buildResources: build
  output: dist

# Only the built app goes in; electron-builder adds the production node_modules itself.
files:
  - out/**
  - package.json

# Reuse the Electron runtime `npm ci` already downloaded instead of fetching it again.
electronDist: node_modules/electron/dist
# No native modules to compile (the database is Node's built-in node:sqlite).
npmRebuild: false

# Everything else is packed into resources/app.asar, an archive Electron reads like a folder.
# Windows cannot start programs from inside it, so the two engine CLIs stay outside, in
# resources/app.asar.unpacked (src/main/providers/external.ts points the SDKs there).
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  - node_modules/@openai/codex-*/vendor/**

# Fuses are switches compiled into faibots.exe and flipped at package time, so nothing at run
# time (an environment variable, a command-line flag) can turn them back on. Nothing in the app
# needs the ones turned off here: both engines are their own native programs and MCP connectors
# run the user's own command. Reasons and checks: docs/PACKAGING.md.
electronFuses:
  runAsNode: false                             # ELECTRON_RUN_AS_NODE=1 no longer turns faibots.exe into Node
  enableNodeOptionsEnvironmentVariable: false  # NODE_OPTIONS (e.g. --require evil.js) is ignored
  enableNodeCliInspectArguments: false         # --inspect / --inspect-brk cannot attach a debugger
  onlyLoadAppFromAsar: true                    # only resources/app.asar is loaded, never a loose app folder
  enableEmbeddedAsarIntegrityValidation: true  # app.asar must match the hash stored in faibots.exe
  enableCookieEncryption: true                 # cookies on disk are encrypted with the OS key (DPAPI)

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

# A normal per-user installer: no admin prompt, installs to %LOCALAPPDATA%\Programs\faibots,
# adds Start menu and desktop shortcuts and an uninstaller. Uninstalling keeps the user's data
# in %APPDATA%\FaiBots.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: faibots
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: ${productName}-Setup-${version}.${ext}
